<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artist Scout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; font-size: 15px; }
  .app { max-width: 700px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; font-weight: 600; }
  h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  h3 { font-size: 13px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  input, select, textarea {
    width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; color: #1a1a1a;
    outline: none; transition: border 0.15s;
  }
  input:focus, select:focus, textarea:focus { border-color: #888; }
  textarea { resize: vertical; }
  button {
    padding: 9px 18px; border-radius: 8px; font-size: 14px; font-family: inherit;
    cursor: pointer; border: 1px solid #ddd; background: #fff; color: #1a1a1a;
    transition: background 0.15s;
  }
  button:hover { background: #f0f0f0; }
  button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  button.primary:hover { background: #333; }
  button.danger { color: #c0392b; border-color: #f0a0a0; }
  button.danger:hover { background: #fff5f5; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #666; font-weight: 500; }
  .section { margin-bottom: 24px; }
  .card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .metric { background: #f8f8f8; border-radius: 8px; padding: 10px 12px; }
  .metric .ml { font-size: 11px; color: #888; margin-bottom: 3px; }
  .metric .mv { font-size: 17px; font-weight: 600; }
  .metric .mg { font-size: 11px; margin-top: 2px; }
  .back { background: none; border: none; color: #888; font-size: 14px; padding: 0; cursor: pointer; margin-bottom: 16px; display: block; }
  .back:hover { background: none; color: #333; }
  .artist-row { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 14px 16px; cursor: pointer; margin-bottom: 10px; transition: border-color 0.15s; }
  .artist-row:hover { border-color: #bbb; }
  .top-pick { background: #f0f7ff; border: 1px solid #c0d8f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; cursor: pointer; }
  .sp-result { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f8f8f8; border-radius: 8px; cursor: pointer; margin-top: 6px; border: 1px solid #eee; }
  .sp-result:hover { background: #efefef; }
  .sp-result img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
  .sp-prefill { background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 10px; padding: 12px 14px; margin-top: 10px; display: flex; align-items: center; gap: 12px; }
  .sp-prefill img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
  .factor { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; margin: 3px; }
  .factor.pos { background: #e8f5e9; color: #2e7d32; }
  .factor.neg { background: #ffebee; color: #c62828; }
  .snap-table { width: 100%; font-size: 12px; border-collapse: collapse; }
  .snap-table th { text-align: left; padding: 6px 8px; color: #888; font-weight: 500; border-bottom: 1px solid #eee; white-space: nowrap; }
  .snap-table td { padding: 6px 8px; border-bottom: 1px solid #f5f5f5; }
  .hrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .spotify-auto { background: #f0f7ff; border: 1px solid #c0d8f0; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #185FA5; margin-top: 4px; }
  @media(max-width:500px){ .grid2{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const SK = 'artist-scout-v2';
const CK = 'artist-scout-creds';

const STATUS = {
  watching:     { label:'Watching',     color:'#5F5E5A', bg:'#F1EFE8' },
  trending:     { label:'Trending',     color:'#185FA5', bg:'#E6F1FB' },
  viral:        { label:'Viral',        color:'#854F0B', bg:'#FAEEDA' },
  breakthrough: { label:'Breakthrough', color:'#0F6E56', bg:'#E1F5EE' },
  faded:        { label:'Faded',        color:'#A32D2D', bg:'#FCEBEB' },
};
const GENRES     = ['Afrobeats','Country','Electronic','Hip-Hop','Indie','Latin','Pop','R&B','Rock','Soul','Other'];
const SOURCES    = ['Spotify','Instagram','TikTok','YouTube','Friend','Press','Other'];
const AESTHETICS = ['Dark & moody','Colorful & maximalist','Clean & minimalist','Retro/nostalgic','Streetwear','Avant-garde','Natural/earthy','Glamorous','Raw & DIY','Other'];
const VIBES      = ['Introspective','Party/hype','Romantic','Rebellious','Spiritual','Playful','Mysterious','Motivational','Melancholic','Other'];

let artists = [], spClientId = '', spSecret = '', rapidKey = '', spToken = null;
let view = 'roster', selectedId = null, pendingBench = null;
let rosterSearch = '', rosterFilter = 'all';
let spResults = [];

function loadStorage(){
  try { artists = JSON.parse(localStorage.getItem(SK)||'[]'); } catch {}
  try { const c=JSON.parse(localStorage.getItem(CK)||'{}'); spClientId=c.id||''; spSecret=c.sec||''; rapidKey=c.rk||''; } catch {}
}
function saveArtists(){ localStorage.setItem(SK, JSON.stringify(artists)); }
function saveCreds(){ localStorage.setItem(CK, JSON.stringify({id:spClientId,sec:spSecret,rk:rapidKey})); }

const n   = v => (v===''||v==null)?null:Number(v);
const fmt = v => { if(v==null||v==='') return '—'; v=Number(v); return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(v); };
const pct = v => v==null?'—':Number(v).toFixed(1)+'%';
const gPct= (a,b)=>(a==null||b==null||a===0)?null:((b-a)/a)*100;

function scoreArtist(a){
  const snaps=a.snapshots||[]; let s=0; const f=[];
  const ie=n(a.igEngagement),te=n(a.tiktokEngagement),igf=n(a.igFollowers),st=n(a.monthlyStreams);
  if(ie!=null){ if(ie>=6){s+=25;f.push({l:'High IG engagement',v:ie.toFixed(1)+'%',p:1});}else if(ie>=3){s+=12;f.push({l:'Decent IG engagement',v:ie.toFixed(1)+'%',p:1});}else f.push({l:'Low IG engagement',v:ie.toFixed(1)+'%',p:0}); }
  if(te!=null){ if(te>=5){s+=20;f.push({l:'Strong TikTok engagement',v:te.toFixed(1)+'%',p:1});}else if(te>=2){s+=10;f.push({l:'Moderate TikTok engagement',v:te.toFixed(1)+'%',p:1});}else f.push({l:'Weak TikTok engagement',v:te.toFixed(1)+'%',p:0}); }
  if(st!=null&&igf!=null&&igf>0){ const r=st/igf; if(r>=5){s+=15;f.push({l:'Great stream/follower ratio',v:r.toFixed(1)+'x',p:1});}else if(r>=2){s+=7;f.push({l:'OK stream/follower ratio',v:r.toFixed(1)+'x',p:1});}else f.push({l:'Low stream/follower ratio',v:r.toFixed(1)+'x',p:0}); }
  if(snaps.length>=2){
    const fi=snaps[0],la=snaps[snaps.length-1];
    const ig=gPct(n(fi.igFollowers),n(la.igFollowers));
    const tt=gPct(n(fi.tiktokFollowers),n(la.tiktokFollowers));
    const sp=gPct(n(fi.monthlyStreams),n(la.monthlyStreams));
    if(ig>20){s+=Math.min(15,ig/5);f.push({l:'IG growth',v:'+'+ig.toFixed(0)+'%',p:1});}
    if(tt>20){s+=Math.min(15,tt/5);f.push({l:'TikTok growth',v:'+'+tt.toFixed(0)+'%',p:1});}
    if(sp>20){s+=Math.min(15,sp/5);f.push({l:'Stream growth',v:'+'+sp.toFixed(0)+'%',p:1});}
    const tp=snaps.reduce((x,s)=>x+(n(s.pressHits)||0),0);
    const tc=snaps.reduce((x,s)=>x+(n(s.collabs)||0),0);
    if(tp>0){s+=Math.min(10,tp*3);f.push({l:'Press',v:tp+' hit'+(tp>1?'s':''),p:1});}
    if(tc>0){s+=Math.min(10,tc*3);f.push({l:'Collabs',v:tc,p:1});}
  }
  if(a.aesthetic&&a.vibe){s+=5;f.push({l:'Clear brand identity',v:'✓',p:1});}
  return {score:Math.min(100,Math.round(s)),factors:f};
}

const sbadge  = st => { const m=STATUS[st]||STATUS.watching; return `<span class="badge" style="background:${m.bg};color:${m.color}">${m.label}</span>`; };
const scbadge = s  => { if(s==null) return `<span style="font-size:12px;color:#888">log data to score</span>`; const c=s>=70?'#0F6E56':s>=40?'#185FA5':'#888'; const bg=s>=70?'#E1F5EE':s>=40?'#E6F1FB':'#F1EFE8'; return `<span class="badge" style="background:${bg};color:${c}">${s}/100</span>`; };

// ── SPOTIFY ────────────────────────────────────────────────────────────────
async function getSpToken(){
  if(spToken&&spToken.exp>Date.now()) return spToken.tok;
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`grant_type=client_credentials&client_id=${encodeURIComponent(spClientId)}&client_secret=${encodeURIComponent(spSecret)}`});
  const d=await r.json();
  if(!d.access_token) throw new Error('bad creds');
  spToken={tok:d.access_token,exp:Date.now()+(d.expires_in-60)*1000};
  return spToken.tok;
}

async function doSpotifySearch(){
  const q=document.getElementById('sp-search-input')?.value?.trim();
  if(!q) return;
  spResults=[];
  document.getElementById('sp-status').textContent='Searching…';
  document.getElementById('sp-results').innerHTML='';
  try{
    const tok=await getSpToken();
    const r=await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=artist&limit=5`,{headers:{Authorization:'Bearer '+tok}});
    const d=await r.json();
    spResults=d.artists?.items||[];
    document.getElementById('sp-status').textContent=spResults.length?'':'No results found.';
    document.getElementById('sp-results').innerHTML=spResults.map((a,i)=>`
      <div class="sp-result" onclick="pickSpotify(${i})">
        ${a.images?.[0]?`<img src="${a.images[0].url}"/>`:'<div style="width:40px;height:40px;background:#eee;border-radius:4px;flex-shrink:0"></div>'}
        <div>
          <div style="font-weight:600">${a.name}</div>
          <div style="font-size:12px;color:#888">${a.followers?.total?fmt(a.followers.total)+' followers':''}${a.genres?.[0]?' · '+a.genres[0]:''}</div>
        </div>
      </div>`).join('');
  }catch(e){ document.getElementById('sp-status').textContent='Error — check Spotify credentials in Settings'; }
}

async function pickSpotify(i){
  const artist=spResults[i];
  if(!pendingBench) pendingBench={};
  document.getElementById('sp-results').innerHTML='';
  document.getElementById('sp-status').textContent='Loading full artist data…';

  try{
    const tok=await getSpToken();

    // Fetch all in parallel
    const [tracksResp, albumsResp] = await Promise.all([
      fetch(`https://api.spotify.com/v1/artists/${artist.id}/top-tracks?market=US`,{headers:{Authorization:'Bearer '+tok}}),
      fetch(`https://api.spotify.com/v1/artists/${artist.id}/albums?include_groups=album,single&market=US&limit=50`,{headers:{Authorization:'Bearer '+tok}})
    ]);

    const tracksData = await tracksResp.json();
    const albumsData = await albumsResp.json();

    const topTrack = tracksData.tracks?.[0]||null;
    const albums = albumsData.items||[];

    let mostRecent=null, earliest=null;
    albums.forEach(al=>{
      if(!mostRecent||al.release_date>mostRecent.release_date) mostRecent=al;
      if(!earliest||al.release_date<earliest.release_date) earliest=al;
    });

    pendingBench.name=artist.name;
    pendingBench.genre=artist.genres?.[0]?(artist.genres[0][0].toUpperCase()+artist.genres[0].slice(1)):'';
    pendingBench._img=artist.images?.[0]?.url||'';
    pendingBench._spFollowers=artist.followers?.total||'';
    pendingBench.topSong=topTrack?.name||'';
    pendingBench._topTrackPopularity=topTrack?.popularity||'';
    pendingBench._mostRecentRelease=mostRecent?.name||'';
    pendingBench._mostRecentReleaseDate=mostRecent?.release_date||'';
    pendingBench._mostRecentReleaseType=mostRecent?.album_type||'';
    pendingBench._firstReleaseDate=earliest?.release_date||'';
    pendingBench._firstReleaseName=earliest?.name||'';

    document.getElementById('sp-status').textContent='';
    document.getElementById('sp-search-input').value='';

    // Update fields inline without re-render
    const set=(id,val)=>{ const el=document.getElementById(id); if(el&&val) el.value=val; };
    set('f-name', pendingBench.name);
    set('f-genre', pendingBench.genre);
    set('f-ts', pendingBench.topSong);

    // Show green summary
    document.getElementById('sp-prefill').innerHTML=`
      <div class="sp-prefill">
        ${pendingBench._img?`<img src="${pendingBench._img}"/>`:''}
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${pendingBench.name} <span style="font-weight:400;color:#2e7d32;font-size:12px">✓ auto-filled from Spotify</span></div>
          <div style="font-size:12px;color:#444;margin-top:4px;display:flex;flex-direction:column;gap:3px">
            <div>👥 <strong>${fmt(pendingBench._spFollowers)}</strong> Spotify followers</div>
            ${topTrack?`<div>🎵 Top track: <strong>${topTrack.name}</strong> (popularity ${topTrack.popularity}/100)</div>`:''}
            ${mostRecent?`<div>🆕 Latest: <strong>${mostRecent.name}</strong> (${mostRecent.album_type}) — ${mostRecent.release_date}</div>`:''}
            ${earliest&&earliest.id!==mostRecent?.id?`<div>📅 First release: <strong>${earliest.name}</strong> — ${earliest.release_date}</div>`:''}
          </div>
        </div>
      </div>`;

  }catch(e){
    console.error(e);
    document.getElementById('sp-status').textContent='Could not load full data — saved basic info only';
    pendingBench.name=artist.name;
    pendingBench.genre=artist.genres?.[0]?(artist.genres[0][0].toUpperCase()+artist.genres[0].slice(1)):'';
    pendingBench._img=artist.images?.[0]?.url||'';
    pendingBench._spFollowers=artist.followers?.total||'';
    const set=(id,val)=>{ const el=document.getElementById(id); if(el&&val) el.value=val; };
    set('f-name',pendingBench.name);
    set('f-genre',pendingBench.genre);
    document.getElementById('sp-prefill').innerHTML=`
      <div class="sp-prefill" style="background:#fff8e1;border-color:#ffe082">
        ${pendingBench._img?`<img src="${pendingBench._img}"/>`:''}
        <div><div style="font-weight:600">${pendingBench.name}</div>
        <div style="font-size:12px;color:#888;margin-top:2px">Basic info loaded. Top tracks/releases unavailable — CORS restriction on this browser.</div></div>
      </div>`;
  }
}

// ── TIKTOK ─────────────────────────────────────────────────────────────────
async function doFetchTikTok(id){
  const a=artists.find(x=>x.id===id);
  if(!a?.tiktokHandle){ alert('Add a TikTok @username to this artist first'); return; }
  if(!rapidKey){ alert('Add your RapidAPI key in ⚙ Settings'); return; }
  const handle=a.tiktokHandle.replace('@','').trim();
  const btn=document.getElementById('tt-btn');
  if(btn){ btn.textContent='Fetching…'; btn.disabled=true; }
  try{
    const r=await fetch(`https://scraptik.p.rapidapi.com/get-user?username=${encodeURIComponent(handle)}`,{headers:{'x-rapidapi-key':rapidKey,'x-rapidapi-host':'scraptik.p.rapidapi.com'}});
    const d=await r.json();
    const stats=d?.user_info?.stats||d?.userInfo?.stats||d?.stats||{};
    const followers=stats.followerCount||d?.followerCount||null;
    const likes=stats.heartCount||d?.heartCount||null;
    if(!followers){ alert('No data returned — double check the @username'); if(btn){btn.textContent='↻ TikTok';btn.disabled=false;} return; }
    artists=artists.map(x=>x.id===id?{...x,tiktokFollowers:String(followers),tiktokLikes:String(likes||''),tiktokLastFetched:new Date().toISOString().slice(0,10)}:x);
    saveArtists(); goTo('detail');
  }catch(e){
    alert('TikTok fetch failed — check your RapidAPI key');
    if(btn){btn.textContent='↻ TikTok';btn.disabled=false;}
  }
}

// ── NAVIGATION ─────────────────────────────────────────────────────────────
function goTo(v){ view=v; renderApp(); window.scrollTo(0,0); }
function selectArtist(id){ selectedId=id; goTo('detail'); }
function startAdd(){ pendingBench={}; spResults=[]; goTo('add'); }

// ── RENDER ─────────────────────────────────────────────────────────────────
function renderApp(){
  const el=document.getElementById('app');
  if(view==='settings') el.innerHTML=renderSettings();
  else if(view==='add')    el.innerHTML=renderAdd();
  else if(view==='snap')   el.innerHTML=renderSnap();
  else if(view==='detail') el.innerHTML=renderDetail();
  else { el.innerHTML=renderRoster(); setTimeout(updateRosterList,0); }
}

// SETTINGS
function renderSettings(){
  return `
  <button class="back" onclick="goTo('roster')">← back</button>
  <h2 style="margin-bottom:4px">Settings</h2>
  <p style="margin-bottom:20px">Credentials stored only in your browser.</p>
  <div style="max-width:460px;display:flex;flex-direction:column;gap:20px">
    <div><h3>Spotify</h3>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="field"><label>Client ID</label><input type="password" id="s-id" value="${spClientId}" placeholder="Paste Client ID"/></div>
        <div class="field"><label>Client Secret</label><input type="password" id="s-sec" value="${spSecret}" placeholder="Paste Client Secret"/></div>
      </div>
    </div>
    <div><h3>TikTok — RapidAPI (ScrapTik)</h3>
      <div class="field"><label>RapidAPI Key</label><input type="password" id="s-rk" value="${rapidKey}" placeholder="Paste RapidAPI key"/></div>
    </div>
    <button class="primary" onclick="saveSettings()">Save</button>
  </div>`;
}
function saveSettings(){
  spClientId=document.getElementById('s-id').value.trim();
  spSecret=document.getElementById('s-sec').value.trim();
  rapidKey=document.getElementById('s-rk').value.trim();
  saveCreds(); goTo('roster');
}

// ADD ARTIST
function renderAdd(){
  const b=pendingBench||{};
  const hasSp=spClientId&&spSecret;
  return `
  <button class="back" onclick="goTo('roster')">← back</button>
  <h2 style="margin-bottom:4px">New artist — benchmark</h2>
  <p style="margin-bottom:20px">Starting point all snapshots are measured against.</p>

  ${hasSp?`<div class="card">
    <h3>Auto-fill from Spotify</h3>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="sp-search-input" placeholder="Search artist name…" style="flex:1"
        onkeydown="if(event.key==='Enter'){event.preventDefault();doSpotifySearch();}"/>
      <button onclick="doSpotifySearch()" style="white-space:nowrap">Search</button>
    </div>
    <div id="sp-status" style="font-size:12px;color:#888;min-height:16px"></div>
    <div id="sp-results"></div>
    <div id="sp-prefill"></div>
  </div>`:`<p style="margin-bottom:20px;font-size:13px;color:#888">Add Spotify credentials in Settings to enable auto-fill.</p>`}

  <div class="section">
    <h3>Identity</h3>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field"><label>Artist name *</label><input id="f-name" value="${b.name||''}" placeholder="Name"/></div>
      <div class="field"><label>Location</label><input id="f-loc" value="${b.location||''}" placeholder="City, Country"/></div>
    </div>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field"><label>Genre</label>
        <select id="f-genre">${GENRES.map(g=>`<option${b.genre===g?' selected':''}>${g}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Discovered via</label>
        <select id="f-src">${SOURCES.map(s=>`<option${(b.source||'Spotify')===s?' selected':''}>${s}</option>`).join('')}</select>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>Date discovered</label><input type="date" id="f-disc" value="${b.discovered||new Date().toISOString().slice(0,10)}"/></div>
      <div class="field"><label>TikTok @username</label><input id="f-tth" value="${b.tiktokHandle||''}" placeholder="@handle"/></div>
    </div>
  </div>

  <div class="section">
    <h3>Spotify data</h3>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field"><label>Monthly streams (manual)</label><input type="number" id="f-st" value="${b.monthlyStreams||''}" placeholder="e.g. 250000"/></div>
      <div class="field"><label>Top track</label><input id="f-ts" value="${b.topSong||''}" placeholder="Auto-filled or type"/></div>
    </div>
    ${b._mostRecentRelease?`
    <div style="background:#f8f8f8;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px">
      <div style="color:#888;font-size:11px;margin-bottom:4px">SPOTIFY AUTO-FILLED</div>
      <div>🆕 Latest release: <strong>${b._mostRecentRelease}</strong> (${b._mostRecentReleaseType||''}) — ${b._mostRecentReleaseDate||''}</div>
      ${b._firstReleaseDate?`<div style="margin-top:3px">📅 First release: <strong>${b._firstReleaseName||''}</strong> — ${b._firstReleaseDate}</div>`:''}
      <div style="margin-top:3px">👥 Spotify followers: <strong>${fmt(b._spFollowers)}</strong></div>
    </div>`:''}
  </div>

  <div class="section">
    <h3>Instagram baseline</h3>
    <div class="grid2">
      <div class="field"><label>Followers</label><input type="number" id="f-igf" value="${b.igFollowers||''}" placeholder="e.g. 45000"/></div>
      <div class="field"><label>Engagement rate %</label><input type="number" id="f-ige" value="${b.igEngagement||''}" placeholder="e.g. 4.2"/></div>
    </div>
  </div>

  <div class="section">
    <h3>TikTok baseline</h3>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field"><label>Followers</label><input type="number" id="f-ttf" value="${b.tiktokFollowers||''}" placeholder="e.g. 80000"/></div>
      <div class="field"><label>Avg views/video</label><input type="number" id="f-ttv" value="${b.tiktokViews||''}" placeholder="e.g. 12000"/></div>
    </div>
    <div class="field" style="max-width:220px"><label>Engagement rate %</label><input type="number" id="f-tte" value="${b.tiktokEngagement||''}" placeholder="e.g. 5.1"/></div>
  </div>

  <div class="section">
    <h3>Branding & strategy</h3>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field"><label>Aesthetic</label>
        <select id="f-aes"><option value="">Select…</option>${AESTHETICS.map(a=>`<option${b.aesthetic===a?' selected':''}>${a}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Vibe</label>
        <select id="f-vib"><option value="">Select…</option>${VIBES.map(v=>`<option${b.vibe===v?' selected':''}>${v}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field" style="margin-bottom:12px"><label>Fan-building tactics</label>
      <textarea id="f-tac" rows="3" placeholder="e.g. daily TikTok storytelling, Discord community…">${b.fanTactics||''}</textarea>
    </div>
    <div class="grid2">
      <div class="field"><label>Release cadence</label><input id="f-rf" value="${b.releaseFrequency||''}" placeholder="e.g. Single monthly"/></div>
      <div class="field"><label>Content frequency</label><input id="f-cf" value="${b.contentFrequency||''}" placeholder="e.g. 3x/week TikTok"/></div>
    </div>
  </div>

  <div class="field" style="margin-bottom:24px"><label>Notes</label>
    <textarea id="f-notes" rows="2" placeholder="How you found them, gut feeling…">${b.notes||''}</textarea>
  </div>
  <button class="primary" onclick="submitArtist()">Save benchmark profile</button>`;
}

function submitArtist(){
  const g=id=>document.getElementById(id)?.value||'';
  const name=g('f-name').trim();
  if(!name){ alert('Artist name is required'); return; }
  const b=pendingBench||{};
  const a={
    id:Date.now(), name, location:g('f-loc'), genre:g('f-genre'), source:g('f-src'),
    discovered:g('f-disc'), tiktokHandle:g('f-tth'),
    monthlyStreams:g('f-st'), topSong:g('f-ts'),
    igFollowers:g('f-igf'), igEngagement:g('f-ige'),
    tiktokFollowers:g('f-ttf'), tiktokViews:g('f-ttv'), tiktokEngagement:g('f-tte'),
    aesthetic:g('f-aes'), vibe:g('f-vib'), fanTactics:g('f-tac'),
    releaseFrequency:g('f-rf'), contentFrequency:g('f-cf'),
    notes:g('f-notes'), status:'watching', snapshots:[],
    _img:b._img||'', _spFollowers:b._spFollowers||'',
    topTrackPopularity:b._topTrackStreams||'',
    mostRecentRelease:b._mostRecentRelease||'',
    mostRecentReleaseDate:b._mostRecentReleaseDate||'',
    mostRecentReleaseType:b._mostRecentReleaseType||'',
    firstReleaseDate:b._firstReleaseDate||'',
    firstReleaseName:b._firstReleaseName||'',
  };
  artists.push(a); saveArtists();
  pendingBench=null; selectedId=a.id; goTo('detail');
}

// SNAPSHOT
function renderSnap(){
  const a=artists.find(x=>x.id===selectedId);
  if(!a) return '';
  return `
  <button class="back" onclick="goTo('detail')">← back</button>
  <h2 style="margin-bottom:4px">Log snapshot</h2>
  <p style="margin-bottom:20px">${a.name}</p>
  <div style="max-width:500px;display:flex;flex-direction:column;gap:12px">
    <div class="field"><label>Date</label><input type="date" id="sn-d" value="${new Date().toISOString().slice(0,10)}" style="max-width:180px"/></div>
    <h3>Spotify</h3>
    <div class="field"><label>Monthly streams</label><input type="number" id="sn-st"/></div>
    <h3>Instagram</h3>
    <div class="grid2">
      <div class="field"><label>Followers</label><input type="number" id="sn-igf"/></div>
      <div class="field"><label>Engagement %</label><input type="number" id="sn-ige"/></div>
    </div>
    <h3>TikTok</h3>
    <div class="grid2">
      <div class="field"><label>Followers</label><input type="number" id="sn-ttf"/></div>
      <div class="field"><label>Avg views</label><input type="number" id="sn-ttv"/></div>
    </div>
    <div class="field" style="max-width:200px"><label>Engagement %</label><input type="number" id="sn-tte"/></div>
    <h3>Press & collabs</h3>
    <div class="grid2">
      <div class="field"><label>Press hits</label><input type="number" id="sn-pr"/></div>
      <div class="field"><label>Collabs</label><input type="number" id="sn-co"/></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="sn-no" rows="2"></textarea></div>
    <button class="primary" onclick="submitSnap()">Save snapshot</button>
  </div>`;
}
function submitSnap(){
  const g=id=>document.getElementById(id)?.value||'';
  const snap={date:g('sn-d'),monthlyStreams:g('sn-st'),igFollowers:g('sn-igf'),igEngagement:g('sn-ige'),tiktokFollowers:g('sn-ttf'),tiktokViews:g('sn-ttv'),tiktokEngagement:g('sn-tte'),pressHits:g('sn-pr'),collabs:g('sn-co'),notes:g('sn-no')};
  artists=artists.map(a=>a.id===selectedId?{...a,snapshots:[...a.snapshots,snap]}:a);
  saveArtists(); goTo('detail');
}

// DETAIL
function renderDetail(){
  const a=artists.find(x=>x.id===selectedId);
  if(!a) return '';
  const {score:sc,factors}=scoreArtist(a);
  const snaps=a.snapshots||[];
  const last=snaps.length?snaps[snaps.length-1]:null;
  const igG=last?gPct(n(a.igFollowers),n(last.igFollowers)):null;
  const ttG=last?gPct(n(a.tiktokFollowers),n(last.tiktokFollowers)):null;
  const stG=last?gPct(n(a.monthlyStreams),n(last.monthlyStreams)):null;
  const ghtml=v=>v!=null?`<div class="mg" style="color:${v>=0?'#2e7d32':'#c62828'}">${v>=0?'↑':'↓'} ${Math.abs(v).toFixed(0)}% since discovery</div>`:'';

  // Calculate career length
  let careerLen='';
  if(a.firstReleaseDate){
    const ms=Date.now()-new Date(a.firstReleaseDate).getTime();
    const yrs=Math.floor(ms/(1000*60*60*24*365));
    const mos=Math.floor((ms%(1000*60*60*24*365))/(1000*60*60*24*30));
    careerLen=yrs>0?`${yrs}y ${mos}m`:mos>0?`${mos} months`:'< 1 month';
  }

  return `
  <button class="back" onclick="goTo('roster')">← roster</button>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px">
    <div style="display:flex;align-items:center;gap:12px">
      ${a._img?`<img src="${a._img}" style="width:56px;height:56px;border-radius:10px;object-fit:cover"/>`:''}
      <div>
        <h2>${a.name}</h2>
        <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;align-items:center">
          ${a.location?`<span style="font-size:13px;color:#888">${a.location}</span>`:''}
          ${a.genre?`<span style="font-size:13px;color:#888">${a.genre}</span>`:''}
          ${sbadge(a.status)}
        </div>
      </div>
    </div>
    <div class="btnrow">
      <button onclick="goTo('snap')">+ log data</button>
      ${rapidKey&&a.tiktokHandle?`<button id="tt-btn" onclick="doFetchTikTok(${a.id})">↻ TikTok</button>`:''}
      <button class="danger" onclick="delArtist(${a.id})">delete</button>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
    <span style="font-size:13px;color:#888">Status:</span>
    <select onchange="setStatus(${a.id},this.value)" style="width:auto">
      ${Object.entries(STATUS).map(([k,m])=>`<option value="${k}"${a.status===k?' selected':''}>${m.label}</option>`).join('')}
    </select>
    <span style="font-size:13px;color:#888;margin-left:8px">Score:</span>
    ${scbadge(sc)}
  </div>

  ${factors.length?`<div class="card"><h3>Why this score</h3>${factors.map(f=>`<span class="factor ${f.p?'pos':'neg'}">${f.l} <strong>${f.v}</strong></span>`).join('')}</div>`:''}

  <div class="section">
    <h3>Spotify</h3>
    <div class="metric-grid">
      <div class="metric"><div class="ml">Monthly streams</div><div class="mv">${fmt(n(a.monthlyStreams))}</div>${ghtml(stG)}</div>
      <div class="metric"><div class="ml">Spotify followers</div><div class="mv">${fmt(n(a._spFollowers))}</div></div>
      ${a.topSong?`<div class="metric"><div class="ml">Top track</div><div class="mv" style="font-size:13px;font-weight:600">${a.topSong}</div>${a.topTrackPopularity?`<div style="font-size:11px;color:#888;margin-top:2px">popularity ${a.topTrackPopularity}/100</div>`:''}</div>`:''}
    </div>
    ${(a.mostRecentRelease||a.firstReleaseDate)?`
    <div style="margin-top:10px;background:#f8f8f8;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px">
      ${a.mostRecentRelease?`<div>🆕 Latest release: <strong>${a.mostRecentRelease}</strong>${a.mostRecentReleaseType?' ('+a.mostRecentReleaseType+')':''}${a.mostRecentReleaseDate?' — '+a.mostRecentReleaseDate:''}</div>`:''}
      ${a.firstReleaseDate?`<div>📅 First release: <strong>${a.firstReleaseName||''}</strong> — ${a.firstReleaseDate}</div>`:''}
      ${careerLen?`<div>⏱ Career length: <strong>${careerLen}</strong></div>`:''}
    </div>`:''}
  </div>

  <div class="section">
    <h3>Social — baseline at discovery</h3>
    <div class="metric-grid">
      <div class="metric"><div class="ml">IG followers</div><div class="mv">${fmt(n(a.igFollowers))}</div>${ghtml(igG)}</div>
      <div class="metric"><div class="ml">IG engagement</div><div class="mv">${pct(n(a.igEngagement))}</div></div>
      <div class="metric"><div class="ml">TikTok followers</div><div class="mv">${fmt(n(a.tiktokFollowers))}</div>${ghtml(ttG)}</div>
      <div class="metric"><div class="ml">TikTok engagement</div><div class="mv">${pct(n(a.tiktokEngagement))}</div></div>
      ${a.tiktokLikes?`<div class="metric"><div class="ml">TikTok likes</div><div class="mv">${fmt(n(a.tiktokLikes))}</div>${a.tiktokLastFetched?`<div style="font-size:11px;color:#888;margin-top:2px">fetched ${a.tiktokLastFetched}</div>`:''}</div>`:''}
    </div>
    ${a.tiktokHandle?`<p style="font-size:13px;margin-top:8px;color:#666">TikTok: <strong style="color:#1a1a1a">@${a.tiktokHandle.replace('@','')}</strong></p>`:''}
  </div>

  ${(a.aesthetic||a.vibe||a.fanTactics)?`
  <div class="section">
    <h3>Branding & strategy</h3>
    <div class="metric-grid">
      ${a.aesthetic?`<div class="metric"><div class="ml">Aesthetic</div><div style="font-size:14px">${a.aesthetic}</div></div>`:''}
      ${a.vibe?`<div class="metric"><div class="ml">Vibe</div><div style="font-size:14px">${a.vibe}</div></div>`:''}
      ${a.releaseFrequency?`<div class="metric"><div class="ml">Releases</div><div style="font-size:14px">${a.releaseFrequency}</div></div>`:''}
      ${a.contentFrequency?`<div class="metric"><div class="ml">Content</div><div style="font-size:14px">${a.contentFrequency}</div></div>`:''}
    </div>
    ${a.fanTactics?`<div class="metric" style="margin-top:10px"><div class="ml">Fan-building tactics</div><div style="font-size:14px;margin-top:4px">${a.fanTactics}</div></div>`:''}
  </div>`:''}

  ${a.notes?`<p style="font-style:italic;color:#888;margin-bottom:20px;font-size:14px">"${a.notes}"</p>`:''}

  <div class="section">
    <h3>Snapshot history</h3>
    ${!snaps.length?`<div style="text-align:center;padding:2rem;color:#aaa;border:1px dashed #ddd;border-radius:10px;font-size:14px">No snapshots yet — hit "+ log data" to start tracking</div>`:`
    <div style="overflow-x:auto">
      <table class="snap-table">
        <thead><tr><th>Date</th><th>Streams</th><th>IG flw</th><th>IG%</th><th>TT flw</th><th>TT%</th><th>Press</th><th>Collabs</th></tr></thead>
        <tbody>${[...snaps].reverse().map(s=>`<tr>
          <td>${s.date}</td><td>${fmt(n(s.monthlyStreams))}</td><td>${fmt(n(s.igFollowers))}</td>
          <td>${pct(n(s.igEngagement))}</td><td>${fmt(n(s.tiktokFollowers))}</td>
          <td>${pct(n(s.tiktokEngagement))}</td><td>${s.pressHits||'—'}</td><td>${s.collabs||'—'}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`}
  </div>`;
}

// ROSTER
function renderRoster(){
  const ranked=[...artists].map(a=>({...a,_s:scoreArtist(a)})).sort((a,b)=>b._s.score-a._s.score);
  const top=ranked[0];
  return `
  <div class="hrow">
    <div><h1>Artist scout</h1><p style="color:#888;font-size:13px">${artists.length} artist${artists.length!==1?'s':''} tracked</p></div>
    <div class="btnrow">
      <button onclick="goTo('settings')">⚙ settings</button>
      <button class="primary" onclick="startAdd()">+ add artist</button>
    </div>
  </div>
  ${top&&top._s.score>0?`
  <div class="top-pick" onclick="selectArtist(${top.id})">
    <div style="font-size:11px;color:#185FA5;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px">🏆 Top prediction pick</div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        ${top._img?`<img src="${top._img}" style="width:36px;height:36px;border-radius:6px;object-fit:cover"/>`:''}
        <div><div style="font-weight:600;font-size:16px">${top.name}</div><div style="font-size:13px;color:#666">${top.genre||''}${top.location?' · '+top.location:''}</div></div>
      </div>
      ${scbadge(top._s.score)}
    </div>
  </div>`:''}
  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <input id="roster-search" placeholder="Search artists…" value="${rosterSearch}"
      oninput="rosterSearch=this.value;updateRosterList()" style="flex:1;min-width:160px"/>
    <select onchange="rosterFilter=this.value;updateRosterList()" style="width:auto">
      <option value="all"${rosterFilter==='all'?' selected':''}>All statuses</option>
      ${Object.entries(STATUS).map(([k,m])=>`<option value="${k}"${rosterFilter===k?' selected':''}>${m.label}</option>`).join('')}
    </select>
  </div>
  <div id="roster-list"></div>`;
}

function updateRosterList(){
  const el=document.getElementById('roster-list');
  if(!el) return;
  const q=rosterSearch.toLowerCase();
  const ranked=[...artists].map(a=>({...a,_s:scoreArtist(a)})).sort((a,b)=>b._s.score-a._s.score);
  const filtered=ranked.filter(a=>
    (!q||a.name.toLowerCase().includes(q)||(a.genre||'').toLowerCase().includes(q)||(a.location||'').toLowerCase().includes(q))
    &&(rosterFilter==='all'||a.status===rosterFilter)
  );
  if(!filtered.length){ el.innerHTML=`<div style="text-align:center;padding:3rem;color:#aaa;font-size:14px">${!artists.length?'No artists yet — add your first one!':'No results.'}</div>`; return; }
  el.innerHTML=filtered.map(a=>`
    <div class="artist-row" onclick="selectArtist(${a.id})">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            ${a._img?`<img src="${a._img}" style="width:32px;height:32px;border-radius:4px;object-fit:cover"/>`:''}
            <span style="font-weight:600">${a.name}</span>
            ${sbadge(a.status)}
          </div>
          <div style="font-size:13px;color:#888;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap">
            ${a.genre?`<span>${a.genre}</span>`:''}
            ${a.location?`<span>${a.location}</span>`:''}
            <span>via ${a.source}</span>
          </div>
        </div>
        <div style="display:flex;gap:14px;align-items:center">
          <div style="font-size:12px;color:#888;text-align:right">
            <div>${fmt(n(a.monthlyStreams))} streams</div>
            <div>${fmt(n(a.igFollowers))} IG · ${fmt(n(a.tiktokFollowers))} TT</div>
          </div>
          ${scbadge(a._s.score)}
        </div>
      </div>
    </div>`).join('');
}

function setStatus(id,st){ artists=artists.map(a=>a.id===id?{...a,status:st}:a); saveArtists(); renderApp(); }
function delArtist(id){ if(confirm('Delete this artist?')){ artists=artists.filter(a=>a.id!==id); saveArtists(); goTo('roster'); } }

loadStorage();
renderApp();
</script>
</body>
</html>
