<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artist Scout</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#faf9f7;color:#1a1a1a;font-size:15px}
  .app{max-width:760px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:24px;font-weight:650;letter-spacing:-0.02em}
  h2{font-size:20px;font-weight:650;letter-spacing:-0.02em}
  h3{font-size:12px;font-weight:650;color:#8a8578;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid #e2ded6;border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:#1a1a1a;outline:none;transition:border .15s}
  input:focus,select:focus,textarea:focus{border-color:#1a1a1a}
  textarea{resize:vertical}
  button{padding:10px 18px;border-radius:9px;font-size:14px;font-family:inherit;cursor:pointer;border:1px solid #e2ded6;background:#fff;color:#1a1a1a;transition:.15s}
  button:hover{background:#f2efe9}
  button.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
  button.primary:hover{background:#383838}
  button.danger{color:#b3261e;border-color:#f0c4c1}
  button.danger:hover{background:#fdf3f2}
  button:disabled{opacity:.45;cursor:not-allowed}
  .back{background:none;border:none;color:#8a8578;font-size:14px;padding:0;margin-bottom:18px;cursor:pointer;display:block}
  .back:hover{background:none;color:#1a1a1a}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:#6b6659;font-weight:550}
  .section{margin-bottom:28px}
  .card{background:#fff;border:1px solid #eae6de;border-radius:14px;padding:18px;margin-bottom:24px}
  .hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .urg{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .urg3{background:#fdeceb;color:#b3261e}
  .urg2{background:#fdf1dc;color:#8a5a00}
  .urg1{background:#eef0f2;color:#5c6470}
  .pot{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:550;background:#ecf0fb;color:#2f4c9c;margin:2px 3px 2px 0}
  .row{background:#fff;border:1px solid #eae6de;border-radius:14px;padding:15px 17px;margin-bottom:10px;cursor:pointer;transition:.15s}
  .row:hover{border-color:#c9c3b6;transform:translateY(-1px)}
  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
  .metric{background:#f4f2ed;border-radius:10px;padding:11px 13px}
  .metric .ml{font-size:11px;color:#8a8578;margin-bottom:3px}
  .metric .mv{font-size:18px;font-weight:650}
  .metric .ms{font-size:11px;color:#8a8578;margin-top:3px}
  .sound{display:flex;gap:10px;align-items:center;background:#f4f2ed;border-radius:10px;padding:10px 13px;margin-bottom:7px;font-size:13px}
  .chk{display:flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid #e2ded6;border-radius:9px;background:#fff;cursor:pointer;font-size:13px;user-select:none}
  .chk input{width:auto;margin:0}
  .chk.on{border-color:#2f4c9c;background:#ecf0fb;color:#2f4c9c;font-weight:550}
  .sp-res{display:flex;align-items:center;gap:10px;padding:10px;background:#f4f2ed;border-radius:10px;cursor:pointer;margin-top:6px;border:1px solid #eae6de}
  .sp-res:hover{background:#eeebe4}
  .sp-res img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0}
  .ok{background:#e9f6ee;border:1px solid #c3e6d1;border-radius:10px;padding:11px 13px;margin-top:10px;font-size:13px;display:flex;gap:11px;align-items:center}
  .ok img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0}
  .warn{background:#fdf6e3;border:1px solid #ecdcae;border-radius:10px;padding:11px 13px;margin-top:10px;font-size:13px;color:#7a5c00}
  .empty{text-align:center;padding:56px 20px;color:#a8a294;font-size:14px}
  .muted{color:#8a8578;font-size:13px}
  @media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY='scout-v3', CKEY='scout-v3-creds', DRAFTKEY='scout-v3-unsaved-draft';
const GENRES=['Electronic','Pop','Indie/Alternative','R&B','Rap','Folk','International','Country','K-Pop'];
const POTENTIALS=['Visual','Social','Artist Project','Publishing'];
const URG={3:{label:'Move now',cls:'urg3'},2:{label:'Watch closely',cls:'urg2'},1:{label:'Keep an eye',cls:'urg1'}};

let artists=[], rapidKey='', view='roster', selId=null, draft=null, editing=false;
let filterUrg='all', filterPot='all', search='';
let spRes=[];
let unsavedDraft=null;

function load(){
  try{artists=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}
  try{rapidKey=(JSON.parse(localStorage.getItem(CKEY)||'{}')).rk||''}catch{}
  try{ const raw=localStorage.getItem(DRAFTKEY); if(raw) unsavedDraft=JSON.parse(raw); }catch{}
}
function save(){ localStorage.setItem(KEY,JSON.stringify(artists)) }
function saveCreds(){ localStorage.setItem(CKEY,JSON.stringify({rk:rapidKey})) }

function snapshotForm(){
  if(view!=='form'||editing) return;
  const g=id=>document.getElementById(id)?.value||'';
  const genres=[...document.querySelectorAll('.genre-cb')].filter(c=>c.checked).map(c=>c.value);
  const pot=[...document.querySelectorAll('.pot-cb')].filter(c=>c.checked).map(c=>c.value);
  const sounds=[0,1,2].map(i=>({name:g(`f-s${i}n`),uses:g(`f-s${i}u`)}));
  const snap={
    img:draft?.img||'', recentType:draft?.recentType||'',
    name:g('f-name'), location:g('f-loc'), genres, poc:g('f-poc'),
    monthlyListeners:g('f-ml'),
    topSong:g('f-tops'), topSongPlays:g('f-topl'), topSongDate:g('f-topd'),
    recentRelease:g('f-recs'), recentPlays:g('f-recl'), recentDate:g('f-recd'),
    igFollowers:g('f-igf'), igEngagement:g('f-ige'),
    sounds, urgency:g('f-urg'), potential:pot, notes:g('f-notes')
  };
  const hasContent = snap.name || snap.location || snap.monthlyListeners || snap.topSong || snap.igFollowers || snap.notes || sounds.some(s=>s.name||s.uses);
  if(hasContent) localStorage.setItem(DRAFTKEY, JSON.stringify(snap));
}

function restoreDraft(){
  draft={...unsavedDraft, sounds: unsavedDraft.sounds||[{},{},{}]};
  editing=false; spRes=[];
  go('form');
}
function discardDraft(){
  localStorage.removeItem(DRAFTKEY);
  unsavedDraft=null;
  render();
}

const n=v=>{ if(v===''||v==null) return null; const c=String(v).replace(/,/g,''); const num=Number(c); return isNaN(num)?null:num; };
function commaNum(el){
  let digits=el.value.replace(/[^\d]/g,'');
  el.value = digits ? Number(digits).toLocaleString('en-US') : '';
}
function smartNum(el){
  const v=el.value.trim();
  if(!v) return;
  const m=v.match(/^([\d,]*\.?\d+)\s*([kKmMbB])?$/);
  if(m){
    let num=parseFloat(m[1].replace(/,/g,''));
    const suf=(m[2]||'').toLowerCase();
    if(suf==='k') num*=1e3;
    else if(suf==='m') num*=1e6;
    else if(suf==='b') num*=1e9;
    el.value=Math.round(num).toLocaleString('en-US');
  } else {
    const digits=v.replace(/[^\d]/g,'');
    el.value=digits?Number(digits).toLocaleString('en-US'):'';
  }
}
const fmt=v=>{if(v==null||v==='')return '—';v=Number(v);if(isNaN(v))return '—';return v>=1e9?(v/1e9).toFixed(1)+'B':v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(v)};
const pctv=v=>v==null?'—':Number(v).toFixed(2)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=d=>{ if(!d) return ''; const p=String(d).split('-'); return p.length>=3?`${p[1]}/${p[2]}/${p[0]}`:d; };
const urgBadge=u=>{const m=URG[u]||URG[1];return `<span class="urg ${m.cls}">${u} · ${m.label}</span>`};

function go(v){view=v;render();window.scrollTo(0,0)}
function open_(id){selId=id;go('detail')}
function newArtist(){draft={sounds:[{},{},{}],potential:[],urgency:2};editing=false;spRes=[];go('form')}
function editArtist(id){const a=artists.find(x=>x.id===id);draft=JSON.parse(JSON.stringify(a));if(!draft.sounds)draft.sounds=[{},{},{}];while(draft.sounds.length<3)draft.sounds.push({});editing=true;spRes=[];go('form')}
function del(id){if(confirm('Delete this artist?')){artists=artists.filter(a=>a.id!==id);save();go('roster')}}
function goSnap(id){selId=id;go('snap')}

/* ---------- Snapshots ---------- */
function renderSnap(){
  const a=artists.find(x=>x.id===selId); if(!a) return '';
  return `
  <button class="back" type="button" onclick="go('detail')">← back</button>
  <h2>Log snapshot</h2>
  <p class="muted" style="margin:4px 0 22px">${esc(a.name)} — check in on their numbers today.</p>
  <div style="max-width:500px">
    <div class="field" style="max-width:200px;margin-bottom:16px"><label>Date</label><input type="date" id="sn-date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="section">
      <h3>Spotify</h3>
      <div class="field"><label>Monthly listeners</label><input onblur="smartNum(this)" id="sn-ml" placeholder="e.g. 250K"></div>
    </div>
    <div class="section">
      <h3>Instagram</h3>
      <div class="grid2">
        <div class="field"><label>Followers</label><input onblur="smartNum(this)" id="sn-igf" placeholder="e.g. 33.2M"></div>
        <div class="field"><label>Engagement rate %</label><input type="number" step="0.01" id="sn-ige" placeholder="e.g. 4.2"></div>
      </div>
    </div>
    <div class="field" style="margin-bottom:16px"><label>Notable events <span style="color:#a8a294">(collabs, tours, features, etc.)</span></label>
      <input id="sn-events" spellcheck="true" autocorrect="on" placeholder="e.g. Tour w/ [artist], feature on [song], signed to [label]"></div>
    <div class="field" style="margin-bottom:20px"><label>Notes <span style="color:#a8a294">(optional)</span></label>
      <textarea id="sn-notes" rows="2" spellcheck="true" autocorrect="on" placeholder="Anything else worth remembering about this check-in"></textarea></div>
    <div class="btnrow">
      <button class="primary" type="button" onclick="submitSnap()">Save snapshot</button>
      <button type="button" onclick="go('detail')">Cancel</button>
    </div>
  </div>`;
}

function submitSnap(){
  const g=id=>document.getElementById(id)?.value?.trim()||'';
  const snap={
    date: g('sn-date')||new Date().toISOString().slice(0,10),
    monthlyListeners: g('sn-ml'), igFollowers: g('sn-igf'), igEngagement: g('sn-ige'),
    events: g('sn-events'), notes: g('sn-notes')
  };
  artists=artists.map(a=>a.id===selId?{...a,snapshots:[...(a.snapshots||[]),snap]}:a);
  save(); go('detail');
}

function delSnap(idx){
  if(!confirm('Delete this snapshot?')) return;
  artists=artists.map(a=>a.id===selId?{...a,snapshots:(a.snapshots||[]).filter((_,i)=>i!==idx)}:a);
  save(); go('detail');
}

/* ---------- Spotify autofill ---------- */
async function spSearch(){
  const q=document.getElementById('sp-q')?.value?.trim(); if(!q)return;
  const st=document.getElementById('sp-st'), rs=document.getElementById('sp-rs');
  spRes=[]; st.textContent='Searching…'; rs.innerHTML='';
  try{
    const r=await fetch(`/api/spotify?action=search&q=${encodeURIComponent(q)}`);
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    spRes=d.artists?.items||[];
    st.textContent=spRes.length?'':'No results.';
    rs.innerHTML=spRes.map((a,i)=>`<div class="sp-res" onclick="spPick(${i})">
      ${a.images?.[0]?`<img src="${a.images[0].url}">`:'<div style="width:40px;height:40px;background:#e5e1d9;border-radius:6px;flex-shrink:0"></div>'}
      <div><div style="font-weight:600">${esc(a.name)}</div>
      <div class="muted">${a.genres?.[0]?esc(a.genres[0]):'tap to autofill releases'}</div></div></div>`).join('');
  }catch(e){ st.textContent='Search failed — '+e.message; }
}

async function spPick(i){
  const a=spRes[i];
  const st=document.getElementById('sp-st'), rs=document.getElementById('sp-rs');
  rs.innerHTML=''; st.textContent='Loading releases…';
  const setv=(id,v)=>{const el=document.getElementById(id);if(el&&v)el.value=v};
  setv('f-name',a.name);
  draft.img=a.images?.[0]?.url||'';
  try{
    const r=await fetch(`/api/spotify?action=artistData&artistId=${a.id}`);
    const d=await r.json();
    const albums=d.albums?.items||[];
    let recent=null;
    albums.forEach(al=>{ if(!recent||al.release_date>recent.release_date) recent=al; });
    if(recent){ setv('f-recs',recent.name); setv('f-recd',recent.release_date); draft.recentType=recent.album_type;
      const tag=document.getElementById('f-rectype');
      if(tag) tag.textContent=`(${recent.album_type})`;
    }
    st.textContent=''; document.getElementById('sp-q').value='';
    document.getElementById('sp-ok').innerHTML=`<div class="ok">
      ${draft.img?`<img src="${draft.img}">`:''}
      <div><div style="font-weight:600">${esc(a.name)} <span style="color:#2e7d4f;font-weight:400;font-size:12px">✓ linked</span></div>
      ${recent?`<div class="muted">Latest: <strong>${esc(recent.name)}</strong> (${recent.album_type}) — ${recent.release_date}</div>`:'<div class="muted">No releases found</div>'}
      <div class="muted" style="margin-top:2px">Listener + play counts aren't in Spotify's API — enter those below.</div></div></div>`;
  }catch(e){ st.textContent='Could not load releases — '+e.message; }
}

/* ---------- TikTok sound discovery ---------- */
function parseHandle(input){
  if(!input) return '';
  const s=String(input).trim();
  const m=s.match(/tiktok\.com\/@([A-Za-z0-9._-]+)/i);
  if(m) return m[1];
  return s.replace(/^@/,'').replace(/\/+$/,'').split('?')[0];
}

async function discoverFromProfile(){
  const handle=parseHandle(document.getElementById('tt-profile')?.value);
  const st=document.getElementById('tt-st');
  if(!handle){ if(st) st.textContent='Paste their TikTok profile link or @handle first.'; return; }
  if(!rapidKey){ if(st) st.textContent='Add your RapidAPI key in Settings first.'; return; }
  if(st) st.textContent='Looking up @'+handle+'…';
  const results=document.getElementById('tt-results');
  if(results) results.innerHTML='';
  try{
    const ur=await fetch(`https://scraptik.p.rapidapi.com/get-user?username=${encodeURIComponent(handle)}`,{
      headers:{'x-rapidapi-key':rapidKey,'x-rapidapi-host':'scraptik.p.rapidapi.com'}
    });
    const ud=await ur.json();
    const u=ud?.user;
    if(!u||!u.nickname){ if(st) st.textContent='Could not find that account — check the link.'; return; }
    if(st) st.textContent='Found @'+handle+' ('+u.nickname+') — searching their sounds…';
    await runSoundSearch(u.nickname, true);
  }catch(e){
    if(st) st.textContent='Lookup failed — '+e.message;
  }
}

async function findSound(){
  const artistName=document.getElementById('f-name')?.value?.trim();
  const query=document.getElementById('tt-search')?.value?.trim();
  const st=document.getElementById('tt-st');
  if(!query){ if(st) st.textContent='Type a song title first.'; return; }
  if(!rapidKey){ if(st) st.textContent='Add your RapidAPI key in Settings first.'; return; }
  if(st) st.textContent='Searching…';
  await runSoundSearch(query, false, artistName);
}

async function runSoundSearch(keyword, isArtistSearch, authorFilterName){
  const st=document.getElementById('tt-st');
  const results=document.getElementById('tt-results');
  if(results) results.innerHTML='';
  try{
    const r=await fetch(`https://scraptik.p.rapidapi.com/search-sounds?keyword=${encodeURIComponent(keyword)}&cursor=0`,{
      headers:{'x-rapidapi-key':rapidKey,'x-rapidapi-host':'scraptik.p.rapidapi.com'}
    });
    const d=await r.json();
    const list=d?.music||[];
    let matches=list;

    const filterName=(authorFilterName||(isArtistSearch?keyword:'')||'').toLowerCase();
    if(filterName){
      const byAuthor=list.filter(m=>{
        const a1=(m.author||'').toLowerCase();
        const a2=(m.matched_song?.author||m.matched_pgc_sound?.author||'').toLowerCase();
        return a1.includes(filterName)||a2.includes(filterName);
      });
      if(byAuthor.length) matches=byAuthor;
    }

    if(!isArtistSearch){
      const qWords=keyword.toLowerCase().split(/\s+/).filter(w=>w.length>2);
      const titleMatches=m=>{
        const t1=(m.title||'').toLowerCase();
        const t2=(m.matched_song?.title||m.matched_pgc_sound?.title||'').toLowerCase();
        const full=keyword.toLowerCase();
        if(t1.includes(full)||t2.includes(full)) return true;
        if(!qWords.length) return false;
        const hit=w=>t1.includes(w)||t2.includes(w);
        return qWords.filter(hit).length>=Math.ceil(qWords.length*0.6);
      };
      const titled=matches.filter(titleMatches);
      if(titled.length) matches=titled;
    }

    matches.sort((a,b)=>(b.user_count||0)-(a.user_count||0));
    matches=matches.slice(0,5);

    if(st) st.textContent='';
    if(!matches.length){
      if(results) results.innerHTML=`<div class="warn">No sounds found. ${isArtistSearch?'Try the specific-song search below instead.':'Try a different title.'}</div>`;
      return;
    }
    window._ttMatches=matches;
    const header=isArtistSearch?`<p class="muted" style="margin-bottom:8px">Sounds credited to ${esc(keyword)}, ranked by usage:</p>`:'';
    if(results) results.innerHTML=header+matches.map((m,i)=>{
      const matchedAuthor=m.matched_song?.author||m.matched_pgc_sound?.author||'';
      const authorLine=matchedAuthor && matchedAuthor.toLowerCase()!==(m.author||'').toLowerCase()
        ? `${esc(m.author)} · from "${esc(matchedAuthor)}"` : esc(m.author||'Unknown');
      return `<div class="sound" style="cursor:default">
        <div style="flex:1">
          <div style="font-weight:600">${esc(m.title)||'Untitled'}</div>
          <div class="muted">${authorLine}</div>
        </div>
        <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <div><strong>${fmt(m.user_count)}</strong> videos</div>
          <div class="btnrow" style="gap:5px">
            <button type="button" onclick="useSoundSlot(${i},0)" style="font-size:12px;padding:4px 9px">→ Slot 1</button>
            <button type="button" onclick="useSoundSlot(${i},1)" style="font-size:12px;padding:4px 9px">→ Slot 2</button>
            <button type="button" onclick="useSoundSlot(${i},2)" style="font-size:12px;padding:4px 9px">→ Slot 3</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    if(st) st.textContent='Search failed — '+e.message;
  }
}

function useSoundSlot(matchIdx, slotIdx){
  const m=window._ttMatches?.[matchIdx];
  if(!m) return;
  const nameEl=document.getElementById('f-s'+slotIdx+'n');
  const usesEl=document.getElementById('f-s'+slotIdx+'u');
  if(nameEl) nameEl.value=m.title||'';
  if(usesEl) usesEl.value=m.user_count?Number(m.user_count).toLocaleString('en-US'):'';
}

/* ---------------------------- SETTINGS ---------------------------- */
function renderSettings(){
  return `
  <button class="back" onclick="go('roster')">← back</button>
  <h2>Settings</h2>
  <p class="muted" style="margin:4px 0 22px">Stored in this browser only.</p>
  <div style="max-width:460px">
    <div class="field" style="margin-bottom:14px">
      <label>RapidAPI key (ScrapTik — TikTok data)</label>
      <input type="password" id="s-rk" value="${esc(rapidKey)}" placeholder="Paste key">
    </div>
    <button class="primary" type="button" onclick="rapidKey=document.getElementById('s-rk').value.trim();saveCreds();go('roster')">Save</button>
  </div>`;
}

/* ---------------------------- FORM ---------------------------- */
function renderForm(){
  const b=draft||{}, s=b.sounds||[{},{},{}], pot=b.potential||[];
  return `
  <button class="back" onclick="go('roster')">← back</button>
  <h2>${editing?'Edit artist':'New artist'}</h2>
  <p class="muted" style="margin:4px 0 22px">Everything except name is optional — fill what you know.</p>

  ${editing?'':`<div class="card">
    <h3>Autofill from Spotify</h3>
    <div style="display:flex;gap:8px">
      <input id="sp-q" placeholder="Search artist name…" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();spSearch()}">
      <button type="button" onclick="spSearch()" style="white-space:nowrap">Search</button>
    </div>
    <div id="sp-st" class="muted" style="min-height:16px;margin-top:6px"></div>
    <div id="sp-rs"></div><div id="sp-ok"></div>
  </div>`}

  <div class="section">
    <h3>Identity</h3>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field"><label>Artist name *</label><input id="f-name" value="${esc(b.name)}" placeholder="Name"></div>
      <div class="field"><label>Location</label><input id="f-loc" value="${esc(b.location)}" placeholder="City, Country"></div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label style="margin-bottom:3px">Genre — select all that apply</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${GENRES.map(g=>`<label class="chk${(b.genres||[]).includes(g)?' on':''}" onclick="setTimeout(()=>this.classList.toggle('on',this.querySelector('input').checked),0)">
          <input type="checkbox" value="${g}" class="genre-cb"${(b.genres||[]).includes(g)?' checked':''}>${g}</label>`).join('')}
      </div>
    </div>
    <div class="field"><label>Point of contact <span style="color:#a8a294">(optional)</span></label>
      <input id="f-poc" value="${esc(b.poc)}" placeholder="Manager, email, @handle"></div>
  </div>

  <div class="section">
    <h3>Spotify</h3>
    <div class="field" style="max-width:300px;margin-bottom:14px">
      <label>Monthly listeners</label><input inputmode="text" onblur="smartNum(this)" id="f-ml" value="${esc(b.monthlyListeners)}" placeholder="e.g. 250,000 or 250K">
    </div>
    <div class="grid3" style="margin-bottom:12px">
      <div class="field"><label>Top song</label><input id="f-tops" value="${esc(b.topSong)}" placeholder="Song title"></div>
      <div class="field"><label>Listens</label><input onblur="smartNum(this)" id="f-topl" value="${esc(b.topSongPlays)}" placeholder="4.2M"></div>
      <div class="field"><label>Released</label><input type="date" id="f-topd" value="${esc(b.topSongDate)}"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Most recent release</label>
        <div style="position:relative">
          <input id="f-recs" value="${esc(b.recentRelease)}" placeholder="Title" style="padding-right:70px">
          <span id="f-rectype" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:#a8a294;pointer-events:none">${b.recentType?`(${esc(b.recentType)})`:''}</span>
        </div>
      </div>
      <div class="field"><label>Listens</label><input onblur="smartNum(this)" id="f-recl" value="${esc(b.recentPlays)}" placeholder="180K"></div>
      <div class="field"><label>Released</label><input type="date" id="f-recd" value="${esc(b.recentDate)}"></div>
    </div>
  </div>

  <div class="section">
    <h3>Instagram</h3>
    <div class="grid2">
      <div class="field"><label>Followers</label><input onblur="smartNum(this)" id="f-igf" value="${esc(b.igFollowers)}" placeholder="e.g. 33.2M"></div>
      <div class="field"><label>Engagement rate %</label><input type="number" step="0.01" id="f-ige" value="${esc(b.igEngagement)}" placeholder="e.g. 4.2"></div>
    </div>
  </div>

  <div class="section">
    <h3>TikTok sounds — top 3</h3>
    <p class="muted" style="margin:-6px 0 12px">Paste their TikTok profile to auto-find their biggest sounds.</p>
    <div class="field" style="margin-bottom:10px">
      <div style="display:flex;gap:8px">
        <input id="tt-profile" placeholder="https://tiktok.com/@artist  or  @artist" style="flex:1"
          onkeydown="if(event.key==='Enter'){event.preventDefault();discoverFromProfile();}">
        <button class="primary" type="button" onclick="discoverFromProfile()" style="white-space:nowrap">Find sounds</button>
      </div>
    </div>
    <div class="field" style="margin-bottom:6px">
      <label style="font-size:12px;color:#a8a294">or check one specific song title</label>
      <div style="display:flex;gap:8px">
        <input id="tt-search" placeholder="Song title…" style="flex:1"
          onkeydown="if(event.key==='Enter'){event.preventDefault();findSound();}">
        <button type="button" onclick="findSound()" style="white-space:nowrap">Search</button>
      </div>
      <div id="tt-st" class="muted" style="font-size:12px;min-height:16px;margin-top:4px"></div>
    </div>
    <div id="tt-results" style="margin-bottom:16px"></div>
    ${[0,1,2].map(i=>`<div class="grid2" style="margin-bottom:10px">
      <div class="field"><label>Sound ${i+1}</label>
        <input id="f-s${i}n" value="${esc(s[i]?.name)}" placeholder="Song / audio name"></div>
      <div class="field"><label>Videos using it</label>
        <input onblur="smartNum(this)" id="f-s${i}u" value="${esc(s[i]?.uses)}" placeholder="e.g. 12.4K"></div>
    </div>`).join('')}
  </div>

  <div class="section">
    <h3>Read</h3>
    <div class="field" style="max-width:340px;margin-bottom:16px">
      <label>Urgency</label>
      <select id="f-urg">
        <option value="3"${b.urgency==3?' selected':''}>3 — Move now</option>
        <option value="2"${(b.urgency==2||b.urgency==null)?' selected':''}>2 — Watch closely</option>
        <option value="1"${b.urgency==1?' selected':''}>1 — Keep an eye</option>
      </select>
    </div>
    <div class="field">
      <label style="margin-bottom:3px">Potential — select all that apply</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${POTENTIALS.map(p=>`<label class="chk${pot.includes(p)?' on':''}" onclick="setTimeout(()=>this.classList.toggle('on',this.querySelector('input').checked),0)">
          <input type="checkbox" value="${p}" class="pot-cb"${pot.includes(p)?' checked':''}>${p}</label>`).join('')}
      </div>
    </div>
  </div>

  <div class="field" style="margin-bottom:24px"><label>Notes</label>
    <textarea id="f-notes" rows="3" spellcheck="true" autocorrect="on" autocapitalize="sentences" placeholder="Why they caught your eye, who's around them, what you'd do with them…">${esc(b.notes)}</textarea></div>

  <div class="btnrow">
    <button class="primary" type="button" onclick="submitForm()">${editing?'Save changes':'Add artist'}</button>
    <button type="button" onclick="go('roster')">Cancel</button>
  </div>`;
}

function submitForm(){
  const g=id=>document.getElementById(id)?.value?.trim()||'';
  const name=g('f-name');
  if(!name){alert('Artist name is required');return}
  const pot=[...document.querySelectorAll('.pot-cb')].filter(c=>c.checked).map(c=>c.value);
  const genres=[...document.querySelectorAll('.genre-cb')].filter(c=>c.checked).map(c=>c.value);
  const sounds=[0,1,2].map(i=>({name:g(`f-s${i}n`),uses:g(`f-s${i}u`)})).filter(s=>s.name||s.uses);
  const rec={
    id: editing?draft.id:Date.now(),
    added: editing?draft.added:new Date().toISOString().slice(0,10),
    img: draft?.img||'',
    name, location:g('f-loc'), genres, poc:g('f-poc'),
    monthlyListeners:g('f-ml'),
    topSong:g('f-tops'), topSongPlays:g('f-topl'), topSongDate:g('f-topd'),
    recentRelease:g('f-recs'), recentPlays:g('f-recl'), recentDate:g('f-recd'),
    recentType: draft?.recentType||'',
    igFollowers:g('f-igf'), igEngagement:g('f-ige'),
    sounds,
    urgency:Number(g('f-urg')||2), potential:pot, notes:g('f-notes')
  };
  if(editing){ artists=artists.map(a=>a.id===rec.id?rec:a) } else { artists.push(rec) }
  save();
  localStorage.removeItem(DRAFTKEY); unsavedDraft=null;
  draft=null; selId=rec.id; go('detail');
}

/* --------------------------- DETAIL --------------------------- */
function renderDetail(){
  const a=artists.find(x=>x.id===selId); if(!a) return '';
  const sounds=(a.sounds||[]).filter(s=>s.name||s.uses);
  const total=sounds.reduce((t,s)=>t+(n(s.uses)||0),0);
  return `
  <button class="back" onclick="go('roster')">← roster</button>
  <div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px">
    <div style="display:flex;gap:13px;align-items:center">
      ${a.img?`<img src="${a.img}" style="width:58px;height:58px;border-radius:12px;object-fit:cover">`:''}
      <div>
        <h2>${esc(a.name)}</h2>
        <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:6px">
          ${urgBadge(a.urgency)}
          ${(a.genres||[]).map(g=>`<span class="muted">${esc(g)}</span>`).join('')}
          ${a.location?`<span class="muted">${esc(a.location)}</span>`:''}
        </div>
      </div>
    </div>
    <div class="btnrow" style="height:fit-content">
      <button type="button" onclick="editArtist(${a.id})">Edit</button>
      <button class="danger" type="button" onclick="del(${a.id})">Delete</button>
    </div>
  </div>

  ${(a.potential||[]).length?`<div style="margin-bottom:20px">${a.potential.map(p=>`<span class="pot">${esc(p)}</span>`).join('')}</div>`:''}

  ${a.poc?`<div class="card" style="padding:13px 16px;margin-bottom:20px">
    <div style="font-size:11px;color:#8a8578;margin-bottom:3px">POINT OF CONTACT</div>
    <div style="font-weight:600">${esc(a.poc)}</div></div>`:''}

  <div class="section">
    <h3>Spotify</h3>
    <div class="metric-grid">
      <div class="metric"><div class="ml">Monthly listeners</div><div class="mv">${fmt(n(a.monthlyListeners))}</div></div>
      ${a.topSong?`<div class="metric"><div class="ml">Top song</div><div class="mv" style="font-size:14px">${esc(a.topSong)}</div>
        <div class="ms">${fmt(n(a.topSongPlays))} plays${a.topSongDate?' · '+dt(a.topSongDate):''}</div></div>`:''}
      ${a.recentRelease?`<div class="metric"><div class="ml">Most recent</div><div class="mv" style="font-size:14px">${esc(a.recentRelease)}${a.recentType?` <span style="font-weight:400;color:#8a8578;font-size:12px">(${esc(a.recentType)})</span>`:''}</div>
        <div class="ms">${fmt(n(a.recentPlays))} plays${a.recentDate?' · '+dt(a.recentDate):''}</div></div>`:''}
    </div>
  </div>

  <div class="section">
    <h3>Instagram</h3>
    <div class="metric-grid">
      <div class="metric"><div class="ml">Followers</div><div class="mv">${fmt(n(a.igFollowers))}</div></div>
      <div class="metric"><div class="ml">Engagement rate</div><div class="mv">${pctv(n(a.igEngagement))}</div></div>
    </div>
  </div>

  <div class="section">
    <h3>TikTok sounds${total?` — ${fmt(total)} videos total`:''}</h3>
    ${sounds.length?sounds.map(s=>`<div class="sound">
      <div style="flex:1;font-weight:550">${esc(s.name)||'<span class="muted">Untitled</span>'}</div>
      <div class="muted">${fmt(n(s.uses))} videos</div></div>`).join(''):
      `<div class="muted">No sounds logged.</div>`}
  </div>

  ${a.notes?`<div class="section"><h3>Notes</h3>
    <div style="background:#fff;border:1px solid #eae6de;border-radius:12px;padding:15px;font-size:14px;line-height:1.55;white-space:pre-wrap">${esc(a.notes)}</div></div>`:''}

  <p class="muted">Added ${dt(a.added)}</p>`;
}

/* --------------------------- ROSTER --------------------------- */
function renderRoster(){
  const banner = unsavedDraft ? `
  <div class="card" style="background:#fff8e1;border-color:#ecdcae;margin-bottom:20px">
    <div style="font-weight:600;margin-bottom:6px">Unsaved artist info found</div>
    <p class="muted" style="margin-bottom:12px">You had ${unsavedDraft.name?`"<strong style="color:#1a1a1a">${esc(unsavedDraft.name)}</strong>"`:'a new artist'} partly filled in before this page reloaded.</p>
    <div class="btnrow">
      <button class="primary" type="button" onclick="restoreDraft()">Load previous data</button>
      <button type="button" onclick="discardDraft()">Discard</button>
    </div>
  </div>` : '';
  return banner + `
  <div class="hrow">
    <div><h1>Artist scout</h1>
      <p class="muted" style="margin-top:4px">${artists.length} artist${artists.length!==1?'s':''}</p></div>
    <div class="btnrow">
      <button type="button" onclick="go('settings')">⚙</button>
      <button class="primary" type="button" onclick="newArtist()">+ Add artist</button>
    </div>
  </div>
  <div style="display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap">
    <input id="q" placeholder="Search name, genre, location…" value="${esc(search)}"
      oninput="search=this.value;list()" style="flex:1;min-width:170px">
    <select onchange="filterUrg=this.value;list()" style="width:auto">
      <option value="all"${filterUrg==='all'?' selected':''}>All urgency</option>
      <option value="3"${filterUrg==='3'?' selected':''}>3 — Move now</option>
      <option value="2"${filterUrg==='2'?' selected':''}>2 — Watch closely</option>
      <option value="1"${filterUrg==='1'?' selected':''}>1 — Keep an eye</option>
    </select>
    <select onchange="filterPot=this.value;list()" style="width:auto">
      <option value="all"${filterPot==='all'?' selected':''}>All potential</option>
      ${POTENTIALS.map(p=>`<option value="${p}"${filterPot===p?' selected':''}>${p}</option>`).join('')}
    </select>
  </div>
  <div id="list"></div>`;
}

function list(){
  const el=document.getElementById('list'); if(!el)return;
  const q=search.toLowerCase();
  const rows=artists
    .filter(a=>(!q||a.name.toLowerCase().includes(q)||(a.genres||[]).some(g=>g.toLowerCase().includes(q))||(a.location||'').toLowerCase().includes(q))
      &&(filterUrg==='all'||String(a.urgency)===filterUrg)
      &&(filterPot==='all'||(a.potential||[]).includes(filterPot)))
    .sort((x,y)=>(y.urgency||0)-(x.urgency||0)||y.id-x.id);
  if(!rows.length){ el.innerHTML=`<div class="empty">${artists.length?'No matches.':'No artists yet — add your first one.'}</div>`; return }
  el.innerHTML=rows.map(a=>{
    const uses=(a.sounds||[]).reduce((t,s)=>t+(n(s.uses)||0),0);
    return `<div class="row" onclick="open_(${a.id})">
      <div style="display:flex;justify-content:space-between;gap:13px;flex-wrap:wrap;align-items:flex-start">
        <div style="flex:1;min-width:150px;display:flex;gap:11px;align-items:center">
          ${a.img?`<img src="${a.img}" style="width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0">`:''}
          <div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span style="font-weight:650">${esc(a.name)}</span>${urgBadge(a.urgency)}
            </div>
            <div class="muted" style="margin-top:3px;display:flex;gap:9px;flex-wrap:wrap">
              ${(a.genres||[]).map(g=>`<span>${esc(g)}</span>`).join('')}${a.location?`<span>${esc(a.location)}</span>`:''}
            </div>
            ${(a.potential||[]).length?`<div style="margin-top:5px">${a.potential.map(p=>`<span class="pot">${esc(p)}</span>`).join('')}</div>`:''}
          </div>
        </div>
        <div style="text-align:right;font-size:12px;color:#8a8578;line-height:1.65">
          <div><strong style="color:#1a1a1a">${fmt(n(a.monthlyListeners))}</strong> listeners</div>
          <div><strong style="color:#1a1a1a">${fmt(n(a.igFollowers))}</strong> IG${a.igEngagement?` · ${pctv(n(a.igEngagement))}`:''}</div>
          ${uses?`<div><strong style="color:#1a1a1a">${fmt(uses)}</strong> TikToks</div>`:''}
        </div>
      </div></div>`;
  }).join('');
}

function render(){
  const el=document.getElementById('app');
  if(view==='form') el.innerHTML=renderForm();
  else if(view==='detail') el.innerHTML=renderDetail();
  else if(view==='snap') el.innerHTML=renderSnap();
  else if(view==='settings') el.innerHTML=renderSettings();
  else { el.innerHTML=renderRoster(); setTimeout(list,0) }
}

load(); render();
document.getElementById('app').addEventListener('input', snapshotForm);
document.getElementById('app').addEventListener('change', snapshotForm);
</script>
</body>
</html>
